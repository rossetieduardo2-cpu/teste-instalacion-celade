name: Teste de instalación (R 4.3.0)

on:
  workflow_dispatch:      # permite ejecutar manualmente desde la pestaña Actions
  push:

jobs:
  instalar:
    name: ${{ matrix.so }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # si un sistema falla, los otros siguen
      matrix:
        include:
          - so: windows
            runner: windows-latest
            r: '4.3.0'
          - so: mac
            runner: macos-latest      # Apple Silicon
            r: '4.3.3'
          - so: linux
            runner: ubuntu-24.04
            r: '4.3.0'

    steps:
      - uses: actions/checkout@v5

      - name: Instalar R ${{ matrix.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: false

      - name: Bibliotecas del sistema (solo Linux)
        if: matrix.so == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev libgdal-dev libgeos-dev \
            libproj-dev libudunits2-dev pandoc

      - name: Ejecutar script de instalación
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}   # evita el límite de descargas de GitHub
        run: Rscript instalar_paquetes_${{ matrix.so }}_gitlab.R

      - name: Diagnóstico readxl
        if: always()
        run: Rscript -e 'library(readxl); print(packageVersion("readxl"))'
        
      - name: Verificar paquetes críticos
        run: |
          Rscript -e 'p <- c("dplyr","ggplot2","sf","leaflet","openxlsx","plotly","readxl","DemoTools","ProjSubnacional"); ok <- vapply(p, requireNamespace, logical(1), quietly = TRUE); print(ok); if (!all(ok)) quit(status = 1)'
